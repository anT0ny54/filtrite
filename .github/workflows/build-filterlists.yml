name: Build filterlists

on:
  push:
    branches:
      - main
  schedule:
    - cron: "00 04 * * *"
  workflow_dispatch:

concurrency:
  group: build-filterlists
  cancel-in-progress: false

permissions:
  contents: write

env:
  TZ: UTC

jobs:
  build:
    name: Build and publish filterlists
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate filterlists
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p logs

          test -f ./generate.sh
          chmod +x ./generate.sh

          ./generate.sh 2>&1 | tee logs/generate.log

      - name: Validate generated files
        shell: bash
        run: |
          set -Eeuo pipefail

          test -d dist
          test -n "$(find dist -maxdepth 1 -type f -name '*.dat' -print -quit)"

          if [[ ! -s release.md ]]; then
            echo "release.md is missing or empty"
            exit 1
          fi

      - name: Generate release tag
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail

          # The run ID prevents collisions when two runs happen in the same second.
          tag_name="filterlists-$(date -u +'%Y-%m-%d-%H-%M-%S')-${GITHUB_RUN_ID}"

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "Creating release: ${tag_name}"

      - name: Publish filterlists release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Automatic list generation
          body_path: release.md
          files: |
            dist/*.dat
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older generated releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          mapfile -t old_releases < <(
            gh release list \
              --limit 100 \
              --json tagName,createdAt \
              --jq '
                map(
                  select(
                    .tagName
                    | test("^filterlists-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]+$")
                  )
                )
                | sort_by(.createdAt)
                | reverse
                | .[2:]
                | .[].tagName
              '
          )

          for tag_name in "${old_releases[@]}"; do
            [[ -z "$tag_name" ]] && continue

            echo "Deleting old release: ${tag_name}"

            gh release delete "$tag_name" \
              --cleanup-tag \
              --yes
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*.log
          if-no-files-found: warn
          retention-days: 7
          
