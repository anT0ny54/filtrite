name: Build legacy Bromite/Cromite adblock

on:
  push:
    branches: [main]
    paths:
      - "lists/*.txt"
      - "custom-rules.txt"
      - "cmd/**"
      - "internal/**"
      - "build.sh"
      - "scripts/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

concurrency:
  group: legacy-bromite-adblock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true

      - name: Download repo
        uses: actions/checkout@v5

      - name: Run unit tests
        run: go test ./...

      - name: Build and validate
        run: |
          chmod +x build.sh scripts/validate.sh
          ./build.sh

      - name: Generate tag name
        run: echo "TAG_NAME=$(date +%F-%H-%M)" >> "$GITHUB_ENV"

      - name: Release filter lists
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dat
          name: Automatic list generation
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          body_path: build/release-summary.md
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete older releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
